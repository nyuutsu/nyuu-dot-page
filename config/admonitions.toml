# Admonition Types
#
# Single source of truth for all admonition styling.
# To add a new type: add a [[type]] entry here, drop icon in static/images/icons/, rebuild.

[[type]]
key = "note"
name = "Note"
icon = "note.webp"
bg = "#304f60"
border = "#007acc"

[[type]]
key = "info"
name = "Info"
icon = "blobwizard.webp"
bg = "#304f60"
border = "#007acc"

[[type]]
key = "warning"
name = "Warning"
icon = "blobnervous.webp"
bg = "#66512c"
border = "#ffcc00"

[[type]]
key = "caution"
name = "Caution"
icon = "blobnervous.webp"
bg = "#66512c"
border = "#ffcc00"

[[type]]
key = "tip"
name = "Tip"
icon = "blobfingerguns.webp"
bg = "#2d4a3e"
border = "#27ae60"

[[type]]
key = "danger"
name = "Danger"
icon = "blobstop.webp"
bg = "#4a2d2d"
border = "#e74c3c"
