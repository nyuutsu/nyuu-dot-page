<article>
  <h1>$title$</h1>

  <p class="archive-subscribe">
    <a href="/rss.xml">
      <img src="/images/icons/rss.svg" alt="" aria-hidden="true"> Subscribe via RSS
    </a>
  </p>

  <ul class="post-list">
  $for(posts)$
    <li class="post-list-item">
      <a href="$url$" class="post-list-title">$title$</a>
      <time class="post-list-date" datetime="$isodate$">$date$</time>
    </li>
  $endfor$
  </ul>
</article>
