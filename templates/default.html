<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$if(title)$$title$ | $endif$nyuu.page</title>

  <!-- Font preload (critical for first paint) -->
  <link rel="preload" href="$preloadFont$" as="font" type="font/woff2" crossorigin>

  <!-- Styles -->
  <link rel="stylesheet" href="$stylesheet$">
  <link rel="icon" type="image/webp" href="/images/favicon.webp">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="nyuu.page RSS" href="/rss.xml">
  <link rel="canonical" href="$canonicalUrl$">

  <!-- SEO -->
  <meta name="description" content="$if(description)$$description$$else$nyuu's personal site$endif$">
  <meta name="author" content="nyuu">

  <!-- Open Graph -->
  <meta property="og:title" content="$if(title)$$title$ | $endif$nyuu.page">
  <meta property="og:type" content="$if(date)$article$else$website$endif$">
  <meta property="og:url" content="$canonicalUrl$">
  <meta property="og:site_name" content="nyuu.page">
  <meta property="og:description" content="$if(description)$$description$$else$nyuu's personal site$endif$">
$if(image)$
  <meta property="og:image" content="https://nyuu.page$image$">
$endif$
  <!-- Twitter Card -->
  <meta name="twitter:card" content="$if(image)$summary_large_image$else$summary$endif$">
  <meta name="twitter:title" content="$if(title)$$title$ | $endif$nyuu.page">
  <meta name="twitter:description" content="$if(description)$$description$$else$nyuu's personal site$endif$">
$if(image)$
  <meta name="twitter:image" content="https://nyuu.page$image$">
$endif$
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <div class="page">
    <header class="site-header">
      <a href="/" class="site-logo">
        <img src="/images/logo.svg" alt="nyuu.page" class="site-logo-img">
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/contact/">Contact</a>
        <a href="/archive/">Archive</a>
        <a href="https://slap.nyuu.page">Slap</a>
        <a href="https://smooth.nyuu.page$url$" class="nav-smooth">Smooth font</a>
        <a href="https://nyuu.page$url$" class="nav-textured">Textured font</a>
      </nav>
    </header>

    <main id="main" class="site-main">
      $body$
    </main>

    <footer class="site-footer">
      <p>nyuu.page · 2023–</p>
      <nav class="footer-icons" aria-label="Social links">
        <a href="mailto:nyuu@nyuu.page" aria-label="Email nyuu@nyuu.page">
          <img src="/images/icons/email.webp" alt="" aria-hidden="true">
        </a>
        <a href="https://github.com/nyuutsu" aria-label="GitHub: nyuutsu">
          <img src="/images/icons/github.webp" alt="" aria-hidden="true">
        </a>
        <a href="https://old.reddit.com/user/nyuutsu/" aria-label="Reddit: nyuutsu">
          <img src="/images/icons/reddit.svg" alt="" aria-hidden="true">
        </a>
        <a href="https://en.wikipedia.org/wiki/Special:Contributions/Nyuuposting" aria-label="Wikipedia: Nyuuposting">
          <img src="/images/icons/wikipedia.webp" alt="" aria-hidden="true">
        </a>
        <a href="/rss.xml" aria-label="RSS feed">
          <img src="/images/icons/rss.svg" alt="" aria-hidden="true">
        </a>
      </nav>
    </footer>
  </div>
</body>
</html>
