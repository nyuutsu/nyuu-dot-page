<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slap</title>
<style>
  :root{
    /* warm daylight — the room. quiet, unfussy, one calm accent. the warmth of slap lives
       in its words and its manners, not in decoration; the theme's job is to not get in
       the way of them. */
    --bg:#f6f3ef; --panel:#fffdfa; --ink:#272320; --muted:#847b70; --hair:#e7e0d7;
    --accent:#7d5c86; --accent-soft:#f3ecf4; --accent-line:#c9b0cf;
    --caution:#8a6a2f; --caution-soft:#faf3e4; --caution-line:#e3d2a8;
    --ok:#4b7350; --ok-soft:#edf3ec; --ok-line:#c2d7c1;

    /* the terminal keeps its OWN palette. it lives on a dark ground and answers to
       terminal contrast, not to the page accent. coupling the two put plum on near-black
       and it was unreadable. */
    --cli-bg:#221e1a; --cli-ink:#efe7dd;
    --cli-verb:#c9bce0; --cli-flag:#8fd6b6; --cli-val:#f0c987; --cli-ph:#8a8177;

    /* explain payload colors — one per AnalysisPayload category, nothing invented */
    --pay-source:#cdc3b4; --pay-target:#5f9a8b; --pay-patch:#7d7fb0;
    --pay-write:#cf8a3d; --pay-fill:#b6ada0; --pay-xor:#9b7fc0;

    --mono:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:30px 20px 90px}

  /* MOCKUP SCAFFOLDING — not part of the design. File pickers are blocked inside the
     artifact sandbox, so these buttons stand in for choosing files. Delete this bar
     (and .scratch in the JS) when the real page is built. */
  .scratch{border:1px dashed #cbbfd0;background:#f6f1f6;border-radius:7px;
           padding:10px 12px;margin:0 0 22px}
  .scratch .lbl{font-family:var(--mono);font-size:10.5px;color:#9a86a0;letter-spacing:.4px;
                text-transform:uppercase;margin:0 0 8px}
  .scratch .row{display:flex;gap:7px;flex-wrap:wrap}
  .scratch button{font-family:var(--mono);font-size:12px;padding:7px 11px;border:1px solid #d9cddb;
                  background:#fff;border-radius:5px;cursor:pointer;color:#5d4a63}
  .scratch button:hover{border-color:var(--accent);color:var(--accent)}

  .brand{font-family:var(--mono);font-size:30px;letter-spacing:-.5px;margin:0 0 2px}
  .tag{color:var(--muted);font-size:13.5px;margin:0 0 24px}

  .verbs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--hair);
         margin-bottom:26px;flex-wrap:wrap}
  .verb{font-family:var(--mono);font-size:13px;padding:8px 14px;cursor:pointer;color:var(--muted);
        border-bottom:2px solid transparent;margin-bottom:-1px}
  .verb.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  /* the rest exist and are welcome — just quieter. not hidden, not insulted. */
  .verb.lesser{font-size:12px;padding:8px 10px;opacity:.62}
  .verb.lesser.on{opacity:1}
  .verb-gap{width:1px;height:15px;background:var(--hair);margin:0 9px}

  /* success */
  .done{border:1px solid var(--ok-line);background:var(--ok-soft);border-radius:8px;
        padding:16px 17px;margin:18px 0 0}
  .done h3{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ok);margin:0 0 10px}
  .done .line{font-size:14px;line-height:1.65;margin:0 0 4px;color:#2f3a30}
  .done .line code{font-family:var(--mono);font-size:13px;background:#fff;border:1px solid var(--ok-line);
                   border-radius:4px;padding:1px 5px}
  .done .file{display:flex;align-items:center;gap:9px;margin-top:13px;padding-top:13px;
              border-top:1px solid var(--ok-line);font-family:var(--mono);font-size:13.5px;color:var(--ink)}
  .done .file .arrow{color:var(--ok);font-weight:600}
  .done .advisory{font-size:13px;color:var(--caution);background:var(--caution-soft);
                  border:1px solid var(--caution-line);border-radius:5px;padding:9px 11px;margin-top:12px;line-height:1.5}
  .done .then{margin-top:13px;display:flex;gap:8px;flex-wrap:wrap}

  /* drag and drop — the whole page is the target */
  .dropveil{position:fixed;inset:0;background:rgba(125,92,134,.10);border:3px dashed var(--accent);
            border-radius:10px;z-index:50;display:flex;align-items:center;justify-content:center;
            pointer-events:none}
  .dropveil span{background:var(--panel);border:1px solid var(--accent-line);border-radius:8px;
                 padding:14px 20px;font-family:var(--mono);font-size:15px;color:var(--accent)}
  .swap{background:none;border:none;font-family:var(--mono);font-size:12px;color:var(--muted);
        cursor:pointer;text-decoration:underline;text-underline-offset:3px;
        text-decoration-color:var(--hair);padding:4px 0;margin-top:2px}
  .swap:hover{color:var(--accent)}

  /* what slap already knows about your rom — surfaced the moment it can be, not after */
  .facts-card{border:1px solid var(--hair);background:var(--panel);border-radius:8px;
              padding:13px 15px;margin:18px 0 0}
  .facts-card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .facts-card .nm{font-family:var(--mono);font-size:14px}
  .facts-card .sz{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .facts-card .hashes{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.8}
  .facts-card .hashes b{color:var(--ink);font-weight:400}
  .verdict{display:flex;gap:9px;align-items:flex-start;margin-top:12px;padding-top:11px;
           border-top:1px solid var(--hair);font-size:13.5px;line-height:1.55}
  .verdict .mk{font-family:var(--mono);font-weight:700;flex:none;font-size:14px}
  .verdict.match{color:var(--ok)}
  .verdict.match .mk{color:var(--ok)}
  .verdict.mismatch{color:var(--caution)}
  .verdict.mismatch .mk{color:var(--caution)}
  .verdict.unchecked{color:var(--muted)}
  .verdict.waiting{color:var(--muted)}
  .rescue-btn{font-family:var(--mono);font-size:13px;padding:9px 16px;border:none;border-radius:6px;
              background:var(--caution);color:#fff;cursor:pointer;margin-top:2px}
  .rescue-btn:hover{filter:brightness(1.08)}

  /* choices are chips, not dropdowns. buttons and checkboxes are comfy; a select is not. */
  .choice{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 2px}
  .choice button{font-family:var(--mono);font-size:12.5px;padding:7px 11px;border:1px solid var(--hair);
                 border-radius:6px;background:#fff;cursor:pointer;color:var(--ink)}
  .choice button:hover{border-color:var(--accent-line)}
  .choice button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .clabel{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:11px 0 6px}
  .blobbox{width:100%;min-height:88px;margin-top:8px;padding:10px 11px;border:1px solid var(--hair);
           border-radius:6px;background:#fff;color:var(--ink);font-family:var(--mono);font-size:13px;
           line-height:1.55;resize:vertical}
  .blobbox:focus{outline:2px solid var(--accent-line);outline-offset:1px}

  /* ---- the sentence: only the operands a bare command needs ---- */
  .sentence{font-size:22px;line-height:2.5;color:#4a443e;margin:6px 0 4px}
  .slot{cursor:pointer}
  .slot.empty{font-family:var(--mono);font-size:18px;color:var(--muted);
              border-bottom:2px dashed #cfc5bb;padding:0 5px}
  .slot.empty:hover{color:var(--accent);border-bottom-color:var(--accent)}
  .slot.filled{position:relative;display:inline-block;margin:0 4px}
  .slot.filled .fn{font-family:var(--mono);font-size:17px;color:var(--ink);
                   border-bottom:2px solid var(--accent);padding:0 5px}
  .slot.filled .role{position:absolute;top:100%;left:0;right:0;text-align:center;white-space:nowrap;
                     font-size:10px;color:var(--muted);letter-spacing:.4px;margin-top:3px}
  .fmtword{font-family:var(--mono);font-size:17px;color:var(--accent);
           border-bottom:2px solid var(--accent);padding:0 4px}
  .fmtword.unset{color:var(--muted);border-bottom-style:dashed;border-bottom-color:#cfc5bb}

  .caveat{display:flex;gap:10px;align-items:flex-start;background:var(--caution-soft);
          border:1px solid var(--caution-line);border-radius:6px;padding:11px 13px;
          margin:16px 0 0;font-size:13px;color:var(--caution);line-height:1.5}
  .caveat .mark{font-family:var(--mono);font-weight:600;flex:none}

  /* ---- format picker: the format is an OPERAND (it's in the sentence), so its picker
          is always visible. the copy lives in the tile — no hover, nothing to discover. ---- */
  .picker{margin:22px 0 0}
  .picker h3{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);
             letter-spacing:.3px;margin:0 0 10px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tile{text-align:left;background:var(--panel);border:1px solid var(--hair);border-radius:8px;
        padding:14px;cursor:pointer;font:inherit;color:var(--ink);
        display:flex;flex-direction:column;gap:6px;transition:border-color .12s,background .12s}
  .tile:hover{border-color:var(--accent-line)}
  .tile.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .tile .name{font-family:var(--mono);font-size:17px;font-weight:600;line-height:1.2}
  .tile.on .name{color:var(--accent)}
  .tile .copy{font-size:12.5px;color:var(--muted);line-height:1.45}
  .tile.curio{border-style:dashed;background:transparent;margin-top:10px}
  .tile.curio.on{background:var(--caution-soft);border-color:var(--caution);border-style:solid;
                 box-shadow:inset 0 0 0 1px var(--caution)}
  .tile.curio.on .name{color:var(--caution)}
  .more-toggle{margin-top:14px;background:none;border:none;font-family:var(--mono);font-size:12.5px;
               color:var(--muted);cursor:pointer;padding:6px 0;text-decoration:underline;
               text-underline-offset:3px;text-decoration-color:var(--hair)}
  .more-toggle:hover{color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chip{font-family:var(--mono);font-size:12.5px;padding:7px 12px;border:1px solid var(--hair);
        border-radius:6px;background:var(--panel);cursor:pointer;color:var(--ink)}
  .chip:hover{border-color:var(--accent-line)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .divider{height:1px;background:var(--hair);margin:28px 0 20px}
  .await{color:var(--muted);font-size:13px;margin:20px 0 0;font-style:italic}

  /* ---- options: appear only once the sentence is satisfied ---- */
  .group{border:1px solid var(--hair);border-radius:6px;background:var(--panel);
         padding:14px 16px;margin-bottom:14px}
  .group h3{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);
            letter-spacing:.3px;margin:0 0 12px}
  .field{display:flex;align-items:baseline;gap:10px;margin:9px 0;flex-wrap:wrap}
  .field label.k{font-family:var(--mono);font-size:12.5px;color:var(--muted);
                 min-width:140px;flex:0 0 140px}
  .field input[type=text]{flex:1;min-width:160px;font-size:14px;padding:7px 9px;
                          border:1px solid var(--hair);border-radius:5px;background:#fff;color:var(--ink)}
  .field select{font-family:var(--mono);font-size:12.5px;padding:6px 7px;border:1px solid var(--hair);
                border-radius:5px;background:#fff;color:var(--ink)}
  .field input:focus,.field select:focus{outline:2px solid var(--accent-line);outline-offset:1px}
  .check{display:flex;align-items:center;gap:8px;margin:9px 0}
  .check label{font-family:var(--mono);font-size:12.5px}
  .check .after{color:var(--muted);font-family:var(--sans);font-size:12.5px}
  .hint{color:var(--muted);font-size:12.5px;margin:6px 0 0;line-height:1.5}

  /* ---- results ---- */
  .results{border:1px solid var(--hair);border-radius:6px;background:var(--panel);
           padding:15px 16px;margin:18px 0 0}
  .results h3{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
  .results .ex{font-size:11.5px;color:var(--muted);font-style:italic;margin:0 0 13px}
  .readout{font-family:var(--mono);font-size:12.5px;line-height:1.95}
  .readout .k{color:var(--muted);display:inline-block;min-width:124px}
  .facts{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:0 0 12px}
  .facts b{color:var(--ink);font-weight:600}
  .maplabel{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0 0 7px}
  .map{display:flex;height:30px;border-radius:5px;overflow:hidden;border:1px solid var(--hair)}
  .seg{flex-basis:0;min-width:4px;cursor:crosshair}
  .segcap{font-family:var(--mono);font-size:12px;color:var(--muted);margin:8px 0 12px;min-height:1.2em}
  .segcap b{color:var(--ink)}
  .legend{display:flex;gap:15px;flex-wrap:wrap;margin:0 0 16px;font-size:12px;color:var(--muted)}
  .legend .lg{display:flex;align-items:center;gap:6px}
  .sw{width:11px;height:11px;border-radius:2px;flex:none}
  .blob{border:1px solid var(--hair);border-radius:6px;background:#fbf7f0;margin:0 0 16px}
  .blob .bh{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:8px 12px;
            border-bottom:1px solid var(--hair)}
  .blob pre{margin:0;padding:11px 12px;font-family:var(--mono);font-size:12.5px;
            white-space:pre-wrap;color:var(--ink);line-height:1.55}
  .rrow{display:flex;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid var(--hair);
        font-family:var(--mono);font-size:12.5px;flex-wrap:wrap}
  .rrow .badge{display:flex;align-items:center;gap:7px;min-width:126px;flex:none}
  .rrow .dot{width:9px;height:9px;border-radius:2px;flex:none}
  .rrow .off{color:var(--muted);min-width:76px;flex:none}
  .rrow .sz{min-width:64px;flex:none}
  .rrow .dt{color:var(--muted)}
  .rhex{font-family:var(--mono);font-size:11.5px;color:var(--caution);padding:2px 0 6px 138px;letter-spacing:.4px}

  /* ---- command at the foot ---- */
  .foot-label{font-family:var(--mono);font-size:11px;color:var(--muted);margin:24px 0 8px}
  .cli{font-family:var(--mono);font-size:13px;background:var(--cli-bg);color:var(--cli-ink);
       border-radius:7px;padding:13px 15px;line-height:1.75;word-break:break-word}
  .cli{white-space:pre-wrap}
  .cli .verb-t{color:var(--cli-verb)} .cli .flag-t{color:var(--cli-flag)}
  .cli .val-t{color:var(--cli-val)}   .cli .ph-t{color:var(--cli-ph)}
  .runbtn{font-family:var(--mono);font-size:14px;padding:12px 26px;border:none;border-radius:6px;
          background:var(--accent);color:#fff;cursor:pointer;margin-top:16px}
  .runbtn:disabled{background:#ddd6dd;color:#fffdfa;cursor:not-allowed}
  .reset{font-family:var(--mono);font-size:12px;color:var(--muted);background:none;border:none;
         cursor:pointer;margin-left:12px}

  @media(max-width:640px){
    .sentence{font-size:19px;line-height:2.4}
    .tiles{grid-template-columns:1fr}
    .tile{padding:16px}
    .field{flex-direction:column;align-items:stretch;gap:5px}
    .field label.k{min-width:0;flex:none}
    .runbtn{width:100%}
    .rhex{padding-left:0}
  }
</style>
</head>
<body>
<div class="dropveil" id="veil" style="display:none"><span>drop them anywhere — slap will sort them out</span></div>
<div class="wrap">
  <h1 class="brand">slap</h1>
  <p class="tag">Apply a patch. Make one. Look inside one. — twenty formats, and nothing you choose ever leaves your browser.</p>

  <div class="scratch">
    <p class="lbl">mockup controls — not part of the design</p>
    <div class="row" id="scratchRow"></div>
  </div>

  <div class="verbs" id="verbs"></div>
  <div id="stage"></div>
</div>

<script>
/* ============================================================================
   HOME BASE. Everything we decided, in one place.

   TWO KINDS OF KNOWLEDGE LIVE HERE, AND THEY MUST NOT BE CONFUSED:

   (1) FACTS THAT ARE SLAP'S.  The format list, the accepted-fields map, the console
       header table, detection, verdicts. In production these come across the boundary
       from `describeSurface` / `identifyPatch` / `checkCreate` / `checkConvert`. They are
       transcribed here ONLY so the mockup runs standalone. If the UI ever keeps its own
       copy of these, it will drift — the first mockup hand-typed a format→fields table
       and it had already gone stale before anyone shipped it.

   (2) OPINIONS THAT ARE THE UI'S.  Which formats to recommend, the copy, the notes, the
       sentences, the labels. slap is deliberately agnostic about whether a format is a
       good IDEA — that is a CLI's virtue and an ez-mode's gap. So the UI holds the
       opinion. The guardrail: the LIST comes from slap, the OPINION comes from here. A
       format slap gains that we have no opinion about still appears, unadorned, under
       "more". It can never go invisible.
   ============================================================================ */

/* ---------- (1) slap's, transcribed ---------- */
const ALL_FORMATS = ['bps','ips','ips32','ebp','ups','ppf1','ppf2','ppf3','ppf4','pmsr',
                     'ninja1','dps','ninja2','aps-n64','aps-gba','gdiff','bsdiff',
                     'xdelta1','rfc-vcdiff','xdelta3'];
const ROM_TYPES = ['raw','nes','fds','snes','n64','gb','gbc','gba','ngp','ngpc','sms',
                   'gg','mega','pce','ws','wsc','lynx','jag','gp32'];
const SECONDARY = ['lzma','djw','fgk'];
const ENCODINGS = ['utf8','shift-jis','cp1252'];

// Slap.Header — token, name, byte width
const CONSOLES = [
  {t:'nes',     n:'NES',        w:16},
  {t:'nes-ffe', n:'NES (FFE)',  w:512},
  {t:'fds',     n:'FDS',        w:16},
  {t:'gb',      n:'Game Boy',   w:512},
  {t:'snes',    n:'SNES',       w:512},
  {t:'pce',     n:'PC Engine',  w:512},
  {t:'lynx',    n:'Lynx',       w:64},
  {t:'a78',     n:'Atari 7800', w:128},
];

const META = {
  title:{flag:'--title',label:'title',kind:'text'},
  author:{flag:'--author',label:'author',kind:'text'},
  description:{flag:'--description',label:'description',kind:'text'},
  version:{flag:'--patch-version',label:'version',kind:'text'},
  genre:{flag:'--genre',label:'genre',kind:'text'},
  language:{flag:'--language',label:'language',kind:'text'},
  date:{flag:'--date',label:'date',kind:'text',ph:'YYYYMMDD'},
  website:{flag:'--website',label:'website',kind:'text'},
  fromName:{flag:'--from-name',label:'source filename',kind:'text'},
  toName:{flag:'--to-name',label:'target filename',kind:'text'},
  romType:{flag:'--rom-type',label:'ROM type',kind:'choice',choices:ROM_TYPES},
  imageType:{flag:'--image-type',label:'image type',kind:'choice',choices:['bin','gi']},
  textMode:{flag:'--ninja2-text-mode',label:'text mode',kind:'choice',choices:['utf8','undeclared']},
  noUndo:{flag:'--no-undo',label:'omit undo data',kind:'flag'},
  omitVerify:{flag:'--omit-verification',label:'omit source-integrity data',kind:'flag'},
  unstable:{flag:'--unstable',label:'mark unstable',kind:'flag'},
  windowSize:{flag:'--window-size',label:'window size',kind:'text',ph:'8m'},
  compression:{label:'compression',kind:'compression'},
  embedBlob:{flag:'--metadata',label:'embedded metadata',kind:'file'},
  diz:{flag:'--diz',label:'FILE_ID.DIZ',kind:'file'},
};
// acceptedMetadataFields
const ACCEPTED = {
  bps:['embedBlob'], ips:[], ips32:[], ebp:['title','author','description'], ups:[],
  ppf1:['description'], ppf2:['description','diz'],
  ppf3:['description','imageType','diz','noUndo','omitVerify'], ppf4:[], pmsr:[],
  ninja1:['romType'], dps:['title','author','version','unstable'],
  ninja2:['title','author','version','description','genre','language','date','website','romType','textMode'],
  'aps-n64':['description'], 'aps-gba':[], gdiff:[], bsdiff:[],
  xdelta1:['omitVerify','compression','fromName','toName'],
  'rfc-vcdiff':['windowSize'],
  xdelta3:['omitVerify','compression','embedBlob','windowSize'],
};
const SECONDARY_FORMATS = new Set(['xdelta3']);
const SMC_FORMATS = new Set(['ips','ips32']);

/* ---------- (2) the UI's own, and only here ---------- */
const RECOMMENDED = ['bps','xdelta3','ppf3'];
const CURIO = 'rfc-vcdiff';
const COPY = {
  bps:"The safe default. Checks it's patching the right file, survives size changes, and every modern patcher reads it.",
  xdelta3:"For big files. Compresses the patch, so disc images and large ROMs stay manageable.",
  ppf3:"For disc images. Can carry undo data and a FILE_ID.DIZ.",
  'rfc-vcdiff':"The actual VCDIFF standard. It works — but nothing out there applies it except slap. Here because it's interesting, not because you should ship it.",
};
// a persistent note shown under the sentence once the format is chosen.
//
// A note DESCRIBES; it does not rank. The recommended tier above already does the steering —
// anyone down here in "more formats" has been steered. So the note's job is to say something
// true and interesting about the thing they are looking at: who made it, what it's for, what
// it can reach. Not "this is worse than bps."
//
// Comparative notes read as criticism no matter how gently they're phrased, and a note that
// exists to tell you that you chose wrong is a small unkindness at the moment you chose.
const NOTE = {
  'rfc-vcdiff': "RFC 3284 — the VCDIFF standard itself. slap is the only patcher we know of that reads one.",
  ips:    "The lingua franca: almost every patcher ever written can apply an IPS. Offsets are 24 bits wide, so a record reaches about 16 MB.",
  ips32:  "IPS with 32-bit offsets, reaching well past the 16 MB mark.",
  ppf1:   "Icarus of Paradox, for the PlayStation scene — the first of the three PPFs.",
  ppf2:   "Paradox's second pass: adds a validation block and room for a FILE_ID.DIZ.",
  xdelta1:"Joshua MacDonald's original xdelta. 1997 to 2003.",
};
// apply, create, explain are the headliners — they are what slap is for, and the tagline
// names them in that order. undo, convert and info exist and are welcome; they are simply
// given less emphasis. Not hidden, not behind a fold, not insulted. Someone who wants undo
// will find it; nobody arrives wanting it.
const PRIMARY = ['apply','create','explain'];
const LESSER  = ['undo','convert','info'];
const VERB_LIST = [...PRIMARY,...LESSER];
const RUN_LABEL = {apply:'Apply',undo:'Peel',create:'Bottle',convert:'Convert',info:'Show info',explain:'Explain'};

/* ---------------------------------------------------------------- state --- */
const blank = () => ({
  apply:  {files:{}, rom:{mode:'asis',console:'snes'}, noVerify:false, amiga:false, ppf1:false, done:false, verify:'match', rescue:null},
  undo:   {files:{}, rom:{mode:'asis',console:'snes'}, noVerify:false, amiga:false, ppf1:false,
           done:false, verify:'match', rescue:null, peelable:'ups'},
  create: {files:{}, format:'bps', meta:{}, comp:{mode:'default',algo:'lzma'}, smc:false, more:false,
           done:false, blobMode:'text'},
  convert:{files:{}, to:'', meta:{}, comp:{mode:'default',algo:'lzma'}, more:false, done:false,
           withRom:null, withFraming:{mode:'asis',console:'snes'}, noVerify:false,
           embedIntent:'carry', dizIntent:'carry', amiga:false, ppf1:false, encoding:'utf8'},
  info:   {files:{}, extractMeta:false, extractDiz:false, amiga:false, ppf1:false, encoding:'utf8'},
  explain:{files:{}, withRom:null, withFraming:{mode:'asis',console:'snes'},
           records:false, amiga:false, ppf1:false, encoding:'utf8'},
});
let S = blank();
let verb = 'apply';   // apply is where everyone lands

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fname = (v,id) => S[v].files[id] ? S[v].files[id].name : null;

function operandsReady(v){
  if(v==='apply'||v==='undo') return !!fname(v,'patch') && !!fname(v,'rom');
  if(v==='create')            return !!fname(v,'orig')  && !!fname(v,'mod');
  if(v==='convert')           return !!fname(v,'patch') && S.convert.to!=='';
  return !!fname(v,'patch');
}

/* -------------------------------------------------------------- setters --- */
function pick(v,id){
  const i=document.createElement('input'); i.type='file';
  i.onchange=()=>{ const f=i.files[0]; if(!f) return;
    S[v].files[id]=f;
    // identifyPatch: the detected format decides which read-side dialects even exist.
    // production asks slap; here we read the one magic that gates a dialect.
    if(id==='patch') sniff(v,f); else render();
  };
  i.click();
}
function sniff(v,file){
  const r=new FileReader();
  r.onload=()=>{ const b=new Uint8Array(r.result);
    S[v].ppf1 = b.length>=4 && b[0]===80&&b[1]===80&&b[2]===70&&b[3]===49; // "PPF1"
    if(!S[v].ppf1) S[v].amiga=false;   // a stale override can't ride onto a patch it doesn't fit
    render();
  };
  r.readAsArrayBuffer(file.slice(0,4));
}
function pickAux(v,key){ const i=document.createElement('input'); i.type='file';
  i.onchange=()=>{ if(i.files[0]){S[v][key]=i.files[0]; render();} }; i.click(); }
function setF(v,k,val){ S[v][k]=val; render(); }
function setMeta(v,id,val){ S[v].meta[id]=val; render(); }
function setComp(v,p,val){ S[v].comp[p]=val; render(); }
function setFraming(v,key,p,val){ S[v][key][p]=val; render(); }
function reset(){ S=blank(); render(); }
function setBlobMode(m){ S.create.blobMode=m; render(); }
function runIt(){ S[verb].done = true; render(); }
function startOver(){ S[verb] = blank()[verb]; render(); }
function swapCreateRoms(){
  const {orig,mod} = S.create.files;
  S.create.files.orig = mod; S.create.files.mod = orig; render();
}

/* ------------------------------------------------ drag and drop ----------
   Drop files anywhere. slap reads each file's magic and sorts them itself — the
   person never has to know which box is which. That is honest magic: it is the
   same detection identifyPatch already does, not a guess.

   On CREATE it stops short, deliberately. Both files are ROMs; slap genuinely cannot
   know which one is the original. So it doesn't pretend — it takes them in the order
   they were dropped and offers a swap. Same gesture, and the difference in confidence
   is principled: matched inputs can be identified, defining inputs cannot. */
const PATCH_MAGICS = [
  {m:'PATCH',    f:'ips'},   {m:'BPS1', f:'bps'},    {m:'UPS1', f:'ups'},
  {m:'PPF',      f:'ppf'},   {m:'BSDIFF40', f:'bsdiff'},
  {m:'NINJA',    f:'ninja'}, {m:'APS10', f:'aps-n64'},
];
function looksLikePatch(head){
  const s = Array.from(head.slice(0,8)).map(b=>String.fromCharCode(b)).join('');
  if(PATCH_MAGICS.some(x=>s.startsWith(x.m))) return true;
  if(head[0]===0xD6 && head[1]===0xC3 && head[2]===0xC4) return true;  // VCDIFF / xdelta3
  return false;
}
const headOf = file => new Promise(res=>{
  const r=new FileReader();
  r.onload=()=>res(new Uint8Array(r.result));
  r.readAsArrayBuffer(file.slice(0,8));
});

async function handleDrop(files){
  const list = Array.from(files).slice(0,2);
  if(!list.length) return;
  const heads = await Promise.all(list.map(headOf));
  const st = S[verb];

  if(verb==='create'){
    // both are ROMs. drop order decides; the swap link is right there.
    if(list[0]) st.files.orig = list[0];
    if(list[1]) st.files.mod  = list[1];
    render(); return;
  }
  // every other verb takes a patch and (maybe) a rom. the magic tells them apart.
  list.forEach((f,i)=>{
    const isPatch = looksLikePatch(heads[i]);
    if(isPatch){ st.files.patch = f; st.ppf1 = String.fromCharCode(...heads[i].slice(0,4))==='PPF1'; }
    else if(verb==='apply'||verb==='undo') st.files.rom = f;
    else st.withRom = f;   // convert / explain take theirs as the optional source
  });
  render();
}
function wireDrop(){
  const veil=document.getElementById('veil');
  let depth=0;
  window.addEventListener('dragenter',e=>{e.preventDefault(); depth++; veil.style.display='flex';});
  window.addEventListener('dragover', e=>e.preventDefault());
  window.addEventListener('dragleave',e=>{ if(--depth<=0){depth=0; veil.style.display='none';} });
  window.addEventListener('drop', e=>{
    e.preventDefault(); depth=0; veil.style.display='none';
    if(e.dataTransfer.files.length) handleDrop(e.dataTransfer.files);
  });
}

/* ---------------------------------------------- CLI preview (one fold) ---- */
const tok=(c,t)=>({c,t});
// bash single-quoting: everything is literal inside '...', and a literal ' is written '\''
const shellQuote = s => "'" + String(s).replace(/'/g, "'\\''") + "'";
const ext=f=>f==='rfc-vcdiff'?'vcdiff':f.replace('-','');
function framingTokens(fr){
  if(fr.mode==='add')    return [tok('flag-t','--add-header'),   tok('val-t',fr.console)];
  if(fr.mode==='remove') return [tok('flag-t','--remove-header'),tok('val-t',fr.console)];
  return [];
}
function metaTokens(v){
  const st=S[v], fmt = v==='create'?st.format:st.to, out=[];
  for(const id of (ACCEPTED[fmt]||[])){
    const spec=META[id];
    if(spec.kind==='compression'){
      if(st.comp.mode==='none') out.push(tok('flag-t','--no-compress'));
      else if(st.comp.mode==='with'&&SECONDARY_FORMATS.has(fmt))
        out.push(tok('flag-t','--compress-with'),tok('val-t',st.comp.algo));
      continue;
    }
    if(spec.kind==='file'){
      if(v==='create'&&id==='embedBlob'){
        // --metadata-text takes the bytes inline. Porcelain in app/, not the engine.
        //
        // It exists because the alternatives were both bad: naming a file the person never
        // made is a lie, and `<(printf ...)` is bash-only — and romhackers are mostly on
        // Windows, so the widget would be printing a command most of its readers cannot run.
        // A flag that takes a string is portable, honest, and useful at a terminal anyway.
        //
        // The bytes go in EXACTLY as typed. byuu's spec recommends XML and then says
        // "literally anything can go here and the patch will still be considered valid" —
        // and slap's own questions.md already settled it: opaque bytes, no validation, no
        // warning. So slap does not wrap, and there is nothing to explain to anyone. The
        // recommendation lives in the textarea's placeholder, where it costs nothing.
        if(st.blobMode==='text' && st.meta.embedBlob)
          out.push(tok('flag-t','--metadata-text'), tok('val-t', shellQuote(st.meta.embedBlob)));
        if(st.blobMode==='file' && st.files.embedBlob)
          out.push(tok('flag-t','--metadata'), tok('', st.files.embedBlob.name));
        continue;
      }
      if(v==='convert'&&id==='embedBlob'){
        if(st.embedIntent==='drop') out.push(tok('flag-t','--drop-metadata'));
        else if(st.embedIntent==='file') out.push(tok('flag-t','--metadata'),tok('ph-t','FILE'));
      } else if(v==='convert'&&id==='diz'){
        if(st.dizIntent==='drop') out.push(tok('flag-t','--drop-diz'));
        else if(st.dizIntent==='file') out.push(tok('flag-t','--diz'),tok('ph-t','FILE'));
      } else {
        const f=st.files[id]; if(f) out.push(tok('flag-t',spec.flag),tok('',f.name));
      }
      continue;
    }
    const val=st.meta[id]; if(!val) continue;
    if(spec.kind==='flag') out.push(tok('flag-t',spec.flag));
    else out.push(tok('flag-t',spec.flag),tok('val-t',/\s/.test(val)?`"${val}"`:val));
  }
  return out;
}
function argv(v){
  const st=S[v], T=[tok('verb-t','slap'),tok('verb-t',v)];
  const put=(...xs)=>xs.forEach(x=>T.push(x));
  const file=(id,mv)=>{const n=fname(v,id); return n?tok('',n):tok('ph-t',mv);};
  const dialect=()=>{ if(st.amiga) put(tok('flag-t','--ppf1-amiga')); };
  const enc=()=>{ if(st.encoding&&st.encoding!=='utf8') put(tok('flag-t','--metadata-encoding'),tok('val-t',st.encoding)); };

  if(v==='apply'||v==='undo'){
    if(st.noVerify) put(tok('flag-t','--no-verify'));
    put(...framingTokens(st.rom)); dialect();
    put(file('patch','PATCH'), file('rom','SOURCE'));
  }
  else if(v==='create'){
    put(tok('flag-t','--format'),tok('val-t',st.format));
    if(st.smc&&SMC_FORMATS.has(st.format)) put(tok('flag-t','--require-smc-shape'));
    put(file('orig','ORIGINAL'), file('mod','MODIFIED'));
    metaTokens(v).forEach(x=>T.push(x));
    put(tok('ph-t','OUTPUT'));   // the web downloads; at a terminal you'd name this yourself
  }
  else if(v==='convert'){
    put(file('patch','PATCH'), tok('flag-t','--to'), st.to?tok('val-t',st.to):tok('ph-t','FORMAT'));
    if(st.withRom){
      put(tok('flag-t','--with'),tok('',st.withRom.name), ...framingTokens(st.withFraming));
      if(st.noVerify) put(tok('flag-t','--no-verify'));
    }
    metaTokens(v).forEach(x=>T.push(x));
    dialect(); enc();
  }
  else if(v==='info'){
    put(file('patch','PATCH'));
    if(st.extractMeta) put(tok('flag-t','--extract-metadata'),tok('ph-t','FILE'));
    if(st.extractDiz)  put(tok('flag-t','--extract-diz'),tok('ph-t','FILE'));
    dialect(); enc();
  }
  else if(v==='explain'){
    put(file('patch','PATCH'));
    if(st.records) put(tok('flag-t','--records'));
    if(st.withRom) put(tok('flag-t','--with'),tok('',st.withRom.name),...framingTokens(st.withFraming));
    dialect(); enc();
  }
  return T;
}
const cliHtml = v => `<div class="cli">${argv(v).map(x=>`<span class="${x.c}">${esc(x.t)}</span>`).join(' ')}</div>`;

/* ------------------------------------------------------- the sentence ----- */
function slot(v,id,role){
  const n=fname(v,id);
  if(!n) return `<span class="slot empty" onclick="pick('${v}','${id}')">${role}</span>`;
  return `<span class="slot filled" onclick="pick('${v}','${id}')">
    <span class="fn">${esc(n)}</span><span class="role">${role}</span></span>`;
}
function fmtWord(v,key){
  const cur=S[v][key];
  return cur ? `<span class="fmtword">${cur}</span>`
             : `<span class="fmtword unset">format</span>`;
}
function sentence(v){
  if(v==='apply')   return `apply ${slot(v,'patch','patch')} to ${slot(v,'rom','rom')}`;
  if(v==='undo')    return `peel ${slot(v,'patch','patch')} from ${slot(v,'rom','rom')}`;
  if(v==='create')  return `bottle the difference between ${slot(v,'orig','original')} and ${slot(v,'mod','modified')} as ${fmtWord('create','format')}`;
  if(v==='convert') return `convert ${slot(v,'patch','patch')} to ${fmtWord('convert','to')}`;
  if(v==='info')    return `show info for ${slot(v,'patch','patch')}`;
  return `explain ${slot(v,'patch','patch')}`;
}

/* ------------------------------------------------------ format picker ----- */
function tile(v,key,f,curio){
  const on = S[v][key]===f ? ' on':'';
  return `<button class="tile${curio?' curio':''}${on}" onclick="setF('${v}','${key}','${f}')">
    <span class="name">${f}</span><span class="copy">${COPY[f]||''}</span></button>`;
}
function picker(v,key){
  const rest = ALL_FORMATS.filter(f=>!RECOMMENDED.includes(f)&&f!==CURIO);
  const st=S[v];
  return `<div class="picker"><h3>${v==='create'?'format':'convert to'}</h3>
    <div class="tiles">${RECOMMENDED.map(f=>tile(v,key,f,false)).join('')}</div>
    ${tile(v,key,CURIO,true)}
    <button class="more-toggle" onclick="setF('${v}','more',${!st.more})">
      ${st.more?'fewer formats':`more formats (${rest.length})`}</button>
    ${st.more?`<div class="chips">${rest.map(f=>
      `<button class="chip${st[key]===f?' on':''}" onclick="setF('${v}','${key}','${f}')">${f}</button>`).join('')}</div>`:''}
  </div>`;
}
function caveat(v,key){
  const f=S[v][key], n=f&&NOTE[f];
  return n ? `<div class="caveat"><span class="mark">note</span><span>${n}</span></div>` : '';
}

/* ----------------------------------------------------------- controls ----- */
const group=(t,b)=>`<div class="group"><h3>${t}</h3>${b}</div>`;
function toggle(v,id,label,after){
  return `<div class="check"><input type="checkbox" ${S[v][id]?'checked':''}
    onchange="setF('${v}','${id}',this.checked)">
    <label>${label}${after?` <span class="after">— ${after}</span>`:''}</label></div>`;
}
// a row of chips instead of a <select>. buttons are comfy; dropdowns hide their options
// and make you go looking for what a thing can even do.
function choice(opts, current, handler){
  return `<div class="choice">${opts.map(o=>
    `<button class="${current===o.v?'on':''}" onclick="${handler}('${o.v}')">${o.l}</button>`).join('')}</div>`;
}
// The user thinks in platforms — "is this an SNES header?" — so the control asks for a
// platform and never mentions bytes. Under the floor, Slap.Header blindly adds or removes
// some number of bytes, and several platforms happen to alias the same number, which makes
// them interchangeable. That is slap's business, not the user's; we don't teach it.
function framingControl(v,key){
  const fr=S[v][key];
  let h=`<p class="clabel">this file's header</p>`;
  h+=choice([
    {v:'asis',   l:'take it as it is'},
    {v:'remove', l:'it has one — take it off'},
    {v:'add',    l:"it hasn't got one — pretend it has"},
  ], fr.mode, `setFramingMode_${v}_${key}`);
  if(fr.mode!=='asis'){
    h+=`<p class="clabel">which console</p>`;
    h+=choice(CONSOLES.map(x=>({v:x.t,l:x.n})), fr.console, `setFramingConsole_${v}_${key}`);
    h+=`<p class="hint">slap can't know whether your copy is headered — you can.
        It'll say what it did.</p>`;
  }
  return h;
}
['apply','undo'].forEach(v=>{
  window[`setFramingMode_${v}_rom`]    = m => setFraming(v,'rom','mode',m);
  window[`setFramingConsole_${v}_rom`] = c => setFraming(v,'rom','console',c);
});
['convert','explain'].forEach(v=>{
  window[`setFramingMode_${v}_withFraming`]    = m => setFraming(v,'withFraming','mode',m);
  window[`setFramingConsole_${v}_withFraming`] = c => setFraming(v,'withFraming','console',c);
});
function amiga(v){
  return S[v].ppf1 ? toggle(v,'amiga','Amiga byte order','this PPF1 reads its offsets big-endian') : '';
}
function encodingField(v){
  return `<p class="clabel">text encoding</p>
    ${choice(ENCODINGS.map(e=>({v:e,l:e})), S[v].encoding, `setEncoding_${v}`)}
    <p class="hint">Some formats store text — descriptions, author names — without recording its encoding.
    slap reads it as UTF-8. If a patch came from a Japanese release and the text looks wrong, that's
    something slap can't know but you might: set it here and it re-reads.</p>`;
}
['convert','info','explain'].forEach(v=>{ window[`setEncoding_${v}`] = e => setF(v,'encoding',e); });
function metaControl(v,id){
  const spec=META[id], st=S[v], fmt=v==='create'?st.format:st.to;

  // Two lanes, two different jobs.
  //
  // TYPE IT — you write content, not markup. slap puts it in a thin XML jacket on the way in,
  // because byuu's spec asks for XML 1.0 UTF-8 and no convention exists in the wild to conflict
  // with (questions.md: BPS patches carrying metadata are rare enough that slap has seen none).
  // A sane default, chosen without ceremony — the same way slap picks sane defaults everywhere
  // else. The person is not told about the jacket because the jacket is not their problem.
  //
  // USE A FILE — verbatim bytes, no interpretation, no jacket. Already how `--metadata FILE`
  // behaves and it does not change. This is the escape hatch: anyone who wants to author their
  // own XML, or embed something that isn't text at all, comes here.
  if(spec.kind==='file' && id==='embedBlob' && v==='create'){
    const mode = st.blobMode||'text';
    let h=`<p class="clabel">embedded metadata</p>
      ${choice([{v:'text',l:'type it'},{v:'file',l:'use a file'}], mode, 'setBlobMode')}`;
    if(mode==='text'){
      h+=`<textarea class="blobbox" placeholder="Zelda Redux v1.2 — by nyuu"
            oninput="setMeta('${v}','embedBlob',this.value)">${esc(st.meta.embedBlob||'')}</textarea>
          <p class="hint">A name, a version, a note — whatever you'd want someone to find in here.</p>`;
    } else {
      const f=st.files.embedBlob;
      h+=`<div class="choice"><button onclick="pick('${v}','embedBlob')">
            ${f?esc(f.name):'choose a file…'}</button></div>
          <p class="hint">Any file at all. slap embeds the bytes exactly as they are.</p>`;
    }
    return h;
  }
  if(spec.kind==='compression'){
    const canAlgo=SECONDARY_FORMATS.has(fmt);
    let h=`<div class="field"><label class="k">compression</label>
      <select onchange="setComp('${v}','mode',this.value)">
        <option value="default"${st.comp.mode==='default'?' selected':''}>on (default)</option>
        <option value="none"${st.comp.mode==='none'?' selected':''}>off</option>
        ${canAlgo?`<option value="with"${st.comp.mode==='with'?' selected':''}>choose algorithm…</option>`:''}
      </select>`;
    if(canAlgo&&st.comp.mode==='with')
      h+=`<select onchange="setComp('${v}','algo',this.value)">${
        SECONDARY.map(a=>`<option${st.comp.algo===a?' selected':''}>${a}</option>`).join('')}</select>`;
    return h+`</div>`;
  }
  if(spec.kind==='flag')
    return `<div class="check"><input type="checkbox" ${st.meta[id]?'checked':''}
      onchange="setMeta('${v}','${id}',this.checked)"><label>${spec.label}</label></div>`;
  if(spec.kind==='choice'){
    const val=st.meta[id]||'';
    return `<div class="field"><label class="k">${spec.label}</label>
      <select onchange="setMeta('${v}','${id}',this.value)"><option value="">(unset)</option>${
        spec.choices.map(c=>`<option${val===c?' selected':''}>${c}</option>`).join('')}</select></div>`;
  }
  if(spec.kind==='file'){
    if(v==='convert'){
      const k=id==='embedBlob'?'embedIntent':'dizIntent', cur=st[k];
      return `<div class="field"><label class="k">${spec.label}</label>
        <select onchange="setF('${v}','${k}',this.value)">
          <option value="carry"${cur==='carry'?' selected':''}>carry from source</option>
          <option value="file"${cur==='file'?' selected':''}>set from file…</option>
          <option value="drop"${cur==='drop'?' selected':''}>drop</option>
        </select></div>`;
    }
    const f=st.files[id];
    return `<div class="field"><label class="k">${spec.label}</label>
      <button class="chip" onclick="pick('${v}','${id}')">${f?esc(f.name):'choose a file…'}</button></div>`;
  }
  return `<div class="field"><label class="k">${spec.label}</label>
    <input type="text" value="${esc(st.meta[id]||'')}" placeholder="${spec.ph||''}"
      oninput="setMeta('${v}','${id}',this.value)"></div>`;
}
function metaPanel(v){
  const fmt = v==='create'?S.create.format:S.convert.to;
  const fields = ACCEPTED[fmt]||[];
  return group(`metadata · ${fmt}`, fields.length
    ? fields.map(id=>metaControl(v,id)).join('')
    : `<p class="hint">${fmt} carries no metadata fields.</p>`);
}
function options(v){
  let h='';
  if(v==='apply'||v==='undo'){
    const st=S[v];
    // Once the patch declares a checksum and the rom already agrees with it, the header control
    // has nothing left to do — every setting it offers would only break a working match. So it
    // goes away. Quietly: no explanation, no greyed-out ghost, no announcement of its own absence.
    //
    // It stays if a directive is currently ACTIVE, though — if stripping a header is what produced
    // the match, that directive is load-bearing and hiding it would trap the person inside it.
    const settled = st.files.patch && st.files.rom && st.verify==='match' && st.rom.mode==='asis';
    if(!settled) h+=group('the rom', framingControl(v,'rom'));
    h+=group('options', toggle(v,'noVerify','skip verification','mismatches become warnings')+amiga(v));
  }
  if(v==='create'){
    if(SMC_FORMATS.has(S.create.format))
      h+=group('constraints', toggle(v,'smc','require SMC header shape','enforce SNESTool truncation shape'));
    h+=metaPanel(v);
  }
  if(v==='convert'){
    const w=S.convert.withRom;
    let b=`<div class="field"><label class="k">source rom</label>
      <button class="chip" onclick="pickAux('convert','withRom')">${w?esc(w.name):'choose a file…'}</button></div>
      <p class="hint">Optional. With the real bytes, slap can apply and re-diff — which is how a target
      that needs data this patch never carried gets what it needs.</p>`;
    if(w) b+=framingControl(v,'withFraming')+toggle(v,'noVerify','skip verification','mismatches become warnings');
    h+=group('source input',b);
    h+=metaPanel(v);
    h+=group('text', encodingField(v)+amiga(v));
  }
  if(v==='info'){
    h+=group('extract', toggle(v,'extractMeta','download embedded metadata','')
                      + toggle(v,'extractDiz','download FILE_ID.DIZ',''));
    h+=group('text', encodingField(v)+amiga(v));
  }
  if(v==='explain'){
    const w=S.explain.withRom;
    let b=toggle(v,'records','show every record','the full walk, not just the shape');
    b+=`<div class="field"><label class="k">source rom</label>
      <button class="chip" onclick="pickAux('explain','withRom')">${w?esc(w.name):'choose a file…'}</button></div>
      <p class="hint">Optional. Resolves copy and delta operations against the real bytes.</p>`;
    if(w) b+=framingControl(v,'withFraming');
    h+=group('options',b);
    h+=group('text', encodingField(v)+amiga(v));
  }
  return h;
}

/* ------------------------------------------------------------ results ---- */
/* info and explain have opposite postures: info answers "what IS this patch" — flat facts.
   explain answers "what does it DO to the bytes" — structure. the bar is a projection of
   PatchAnalysis: width from region size, color from AnalysisPayload. nothing invented. */
const PAYLOAD = {
  source:{c:'var(--pay-source)', l:'from source'},
  target:{c:'var(--pay-target)', l:'from output'},
  write: {c:'var(--pay-write)',  l:'new bytes'},
};
const DEMO = [
  {p:'source', op:'SourceRead', off:0x000000, size:1179648, d:'source 0x000000'},
  {p:'write',  op:'TargetRead', off:0x120000, size:48,      d:'literal bytes',
   hex:'4c 20 12 a0  ff 00 3e 80  cd 44 12 21  9c 4e 00 ff'},
  {p:'source', op:'SourceCopy', off:0x120030, size:524288,  d:'source 0x120000  (delta +48)'},
  {p:'target', op:'TargetCopy', off:0x1a0030, size:256,     d:'delta −1024'},
  {p:'source', op:'SourceRead', off:0x1a0130, size:389808,  d:'source 0x1a0100'},
];
const BLOB = `<patch>\n  <name>Oracle of Seasons — Widescreen</name>\n  <author>nyuu</author>\n</patch>`;
const bytes = n => n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';
const hexo  = n => '0x'+n.toString(16).padStart(6,'0');
function segcap(i){
  const r=DEMO[i];
  document.getElementById('segcap').innerHTML =
    `<b>${r.op}</b> · ${hexo(r.off)} · ${bytes(r.size)} · ${esc(r.d)}`;
}
function infoResults(){
  const b=`format         BPS
source size    2.00 MB
target size    2.03 MB
source CRC     a1b2c3d4
target CRC     e5f6a7b8
patch CRC      0f1e2d3c
embedded data  84 bytes
actions        1,204`;
  return `<div class="results"><h3>results</h3>
    <p class="ex">example — the operation doesn't run in this mockup</p>
    <pre class="readout">${esc(b)}</pre></div>`;
}
function explainResults(){
  const full=S.explain.records;
  const kinds=[...new Set(DEMO.map(r=>r.p))];
  const map=`<div class="map">${DEMO.map((r,i)=>
    `<div class="seg" style="flex-grow:${r.size};background:${PAYLOAD[r.p].c}"
      onmouseover="segcap(${i})" title="${r.op} · ${bytes(r.size)}"></div>`).join('')}</div>`;
  const legend=`<div class="legend">${kinds.map(k=>
    `<span class="lg"><span class="sw" style="background:${PAYLOAD[k].c}"></span>${PAYLOAD[k].l}</span>`).join('')}</div>`;
  const walk=DEMO.map(r=>
    `<div class="rrow"><span class="badge"><span class="dot" style="background:${PAYLOAD[r.p].c}"></span>${r.op}</span>
      <span class="off">${hexo(r.off)}</span><span class="sz">${bytes(r.size)}</span><span class="dt">${esc(r.d)}</span></div>`+
    (r.hex?`<div class="rhex">${r.hex}</div>`:'')).join('')
    +`<div class="rrow"><span class="badge" style="color:var(--muted)">… 1,199 more</span></div>`;
  return `<div class="results"><h3>results</h3>
    <p class="ex">example — the operation doesn't run in this mockup</p>
    <p class="facts"><b>BPS</b> · source 2.00 MB → target 2.03 MB · 1,204 actions</p>
    <p class="maplabel">how the target is rebuilt →</p>
    ${map}<p class="segcap" id="segcap">hover the bar to inspect a region</p>${legend}
    <div class="blob"><div class="bh">embedded metadata · 84 bytes · reads as UTF-8 text</div>
      <pre>${esc(BLOB)}</pre></div>
    ${full?walk:''}</div>`;
}

/* ------------------------------------------------------------ success ----
   The file lands in the browser's downloads — downloaded from yourself, which is the
   proof of the promise: it never left.

   On screen, the thing worth saying is not "done" but "it went RIGHT". A good apply is
   otherwise indistinguishable from a lucky one. So we say what was checked and what
   matched — which is exactly what the person came to find out. Advisories surface here
   too, because slap never reframes a file silently. */
const outName = () => {
  if(verb==='create'||verb==='convert'){
    const f = verb==='create'?S.create.format:S.convert.to;
    return 'patch.'+ext(f);
  }
  const r=S[verb].files.rom;
  const base = r ? r.name.replace(/\.[^.]+$/,'') : 'rom';
  return base + (verb==='undo'?'-unpatched':'-patched') + (r&&/\.[^.]+$/.test(r.name)?r.name.match(/\.[^.]+$/)[0]:'.bin');
};
function successPanel(){
  const st=S[verb];
  const framed = (st.rom&&st.rom.mode!=='asis') ? st.rom : null;
  const adv = framed
    ? `<div class="advisory">${framed.mode==='remove'?'Removed':'Added'} the
       ${(CONSOLES.find(c=>c.t===framed.console)||{}).n} header before reading. Your original file is untouched.</div>`
    : '';

  if(verb==='apply'||verb==='undo'){
    return `<div class="done"><h3>done</h3>
      <p class="line">Your rom hashed to <code>a1b2c3d4</code> — exactly what the patch expected.</p>
      <p class="line">The result hashes to <code>e5f6a7b8</code> — exactly what the patch promised.</p>
      ${adv}
      <div class="file"><span class="arrow">↓</span> <span>${esc(outName())}</span>
        <span style="color:var(--muted)">is in your downloads</span></div>
      <div class="then">
        <button class="chip" onclick="startOver()">do another</button>
      </div></div>`;
  }
  if(verb==='create'||verb==='convert'){
    const f = verb==='create'?S.create.format:S.convert.to;
    return `<div class="done"><h3>done</h3>
      <p class="line">Made a 12.8 KB <code>${f}</code> patch.</p>
      <p class="line">It carries the checksums of both files, so whoever applies it will know
        they've got the right rom before a byte is written.</p>
      ${adv}
      <div class="file"><span class="arrow">↓</span> <span>${esc(outName())}</span>
        <span style="color:var(--muted)">is in your downloads</span></div>
      <div class="then">
        <button class="chip" onclick="setVerb('explain')">look inside it</button>
        <button class="chip" onclick="startOver()">make another</button>
      </div></div>`;
  }
  return '';
}

/* ------------------------------------------------------ header rescue -----
   Run a few hashes. If one matches, say so. That is the whole feature.

   Internally slap only ever adds or removes bytes blindly — that is what Slap.Header does
   and all it does. But that is slap's business, not the user's. The user thinks in
   platforms: "is this an SNES header?" So the UI speaks platforms and never mentions bytes.

   Several platforms happen to alias the same byte count, which makes them functionally
   identical here — so the nudge simply shows them as sharing, and any of them works. */
const HEADER_GROUPS = [
  {consoles:['nes','fds']},
  {consoles:['lynx']},
  {consoles:['a78']},
  {consoles:['nes-ffe','gb','snes','pce']},
];
function platformPhrase(consoles){
  const names = consoles.map(t=>(CONSOLES.find(c=>c.t===t)||{}).n);
  return names.join(' / ');
}
function acceptRescue(){
  const st=S[verb], r=st.rescue;
  if(!r||!r.found) return;
  st.rom = {mode:r.dir, console:r.consoles[0]};
  st.verify='match';
  render();
}
function rescueOffer(v){
  const r=S[v].rescue;
  if(!r) return '';
  if(!r.found){
    return `<p style="margin:9px 0 0">slap tried every header it knows and none of them
      reconcile these two. This is most likely a different rom — no amount of header fiddling
      will help. You can still <i>skip verification</i> below and apply it anyway.</p>`;
  }
  const motion = r.dir==='remove' ? 'comes off' : 'goes on';
  return `<p style="margin:9px 0 6px">But it matches once a
    <b>${platformPhrase(r.consoles)}</b> header ${motion}.</p>
    <button class="rescue-btn" onclick="acceptRescue()">
      ${r.dir==='remove'?'take it off':'put one on'}</button>`;
}

/* ------------------------------------------------------- who can peel -----
   Undo is the one verb that most patches simply cannot do, and there is no sense letting
   someone pick two files and press a button to find that out.

   slap's own help says it: "PPF3 undo data, or UPS self-inverse". A ups patch is its own
   reverse — the format is symmetric, so it always peels. A ppf3 peels only if whoever made it
   chose to carry undo data ('ppf3HasUndo'), so it is a property of the patch, not the format.
   Everything else is one-way.

   So the tab says who can, always; and once a patch is in, it says whether that one can. */
function peelNotice(v){
  if(v!=='undo') return '';
  const st=S.undo, patch=st.files.patch;

  if(!patch) return `<div class="caveat"><span class="mark">note</span><span>
    Only two kinds of patch can be peeled. A <b>ups</b> patch is its own reverse. A <b>ppf3</b>
    can be, if whoever made it included undo data. Everything else is one-way — a patch says how
    to get there, not how to get back.</span></div>`;

  if(st.peelable==='ups') return `<div class="facts-card"><div class="verdict match">
    <span class="mk">✓</span><span><b>${esc(patch.name)}</b> is a ups — it's its own reverse,
    so it peels.</span></div></div>`;

  if(st.peelable==='ppf3') return `<div class="facts-card"><div class="verdict match">
    <span class="mk">✓</span><span><b>${esc(patch.name)}</b> carries undo data, so it peels.</span>
    </div></div>`;

  if(st.peelable==='ppf3-bare') return `<div class="caveat"><span class="mark">note</span><span>
    <b>${esc(patch.name)}</b> is a ppf3, but it was made without undo data — so there's nothing
    here to reverse. That was the patch author's choice, not something you can recover.</span></div>`;

  return `<div class="caveat"><span class="mark">note</span><span>
    <b>${esc(patch.name)}</b> is one-way and can't be peeled. To get back to your original rom
    you'd need a copy of it — a patch describes how to get there, not how to get back.</span></div>`;
}

/* -------------------------------------------- what slap already knows -----
   The moment a rom is chosen, slap can hash it. The moment a patch is chosen too, slap can
   say whether they belong together — cheaply, before a byte is written. That is the single
   most useful thing it can tell someone, and it should not wait for the button.

   This is `checkApply`, and it is why the earlier sketch was wrong to say apply has no
   pre-flight: "is this the rom the patch expects?" is a real question with a cheap answer.

   Three verdicts, and the third is the interesting one:
     match      — the patch declares a source checksum and yours agrees.
     mismatch   — it declares one and yours doesn't. Warn; do not block. "skip verification"
                  exists, and someone may know better than the patch does.
     unchecked  — the patch declares NOTHING. IPS records no checksum, so slap cannot tell
                  you whether this is the right rom. Said plainly, this teaches what bps is
                  for without ever ranking one format above another. */
function romFactsCard(v){
  const st=S[v];
  const rom=st.files.rom, patch=st.files.patch;
  if(!rom) return '';
  const verdict = !patch ? 'waiting' : (st.verify||'match');

  const line = {
    waiting:  ['·', `Pick a patch and slap will check this rom against it.`],
    match:    ['✓', `This is the rom <b>${patch?esc(patch.name):''}</b> expects.`],
    mismatch: ['!', `<b>${patch?esc(patch.name):''}</b> expects a rom whose CRC32 is <code>a1b2c3d4</code>.
                     Yours is <code>deadbeef</code>.${rescueOffer(v)}`],
    unchecked:['~', `<b>${patch?esc(patch.name):''}</b> doesn't record which rom it's for, so slap
                     can't check this one for you. IPS patches never do.`],
  }[verdict];

  return `<div class="facts-card">
    <div class="top"><span class="nm">${esc(rom.name)}</span><span class="sz">2.00 MB</span></div>
    <div class="hashes">
      CRC32 &nbsp;<b>${verdict==='mismatch'?'deadbeef':'a1b2c3d4'}</b><br>
      MD5 &nbsp;&nbsp;&nbsp;<b>9f2c4e1a77b3d05e8c6a1f4b2d9e7c30</b>
    </div>
    <div class="verdict ${verdict}"><span class="mk">${line[0]}</span><span>${line[1]}</span></div>
  </div>`;
}

/* ---------------------------------------------- MOCKUP SCAFFOLDING -------
   File pickers don't open inside the artifact sandbox, so these stand in for choosing
   files and let every state be reached by tapping. Not part of the design; delete with
   the .scratch markup when the real page is built. */
const sample = n => ({name:n, size:2097152});
function loadSamples(){
  const st=S[verb];
  if(verb==='apply'||verb==='undo'){ st.files.patch=sample('zelda-redux.bps'); st.files.rom=sample('zelda.gbc'); st.ppf1=false; }
  else if(verb==='create'){ st.files.orig=sample('zelda.gbc'); st.files.mod=sample('zelda-hacked.gbc'); }
  else if(verb==='convert'){ st.files.patch=sample('hack.ips'); st.ppf1=false; if(!st.to) st.to='bps'; }
  else { st.files.patch=sample('hack.bps'); st.ppf1=false; }
  st.done=false; render();
}
function loadPPF1(){
  const st=S[verb];
  if(verb==='create'){ setVerb('apply'); return loadPPF1(); }
  st.files.patch=sample('suikoden.ppf');
  st.ppf1=true;                                   // a real page asks identifyPatch; here we assert it
  if(verb==='apply'||verb==='undo') st.files.rom=sample('suikoden.bin');
  st.done=false; render();
}
function clearVerify(state){
  const st=S[verb];
  st.verify=state; st.rescue=null; st.rom={mode:'asis',console:'snes'}; st.done=false; render();
}
function mismatchRescuable(){
  const st=S[verb];
  st.verify='mismatch';
  st.rescue={found:true, dir:'remove', consoles:['nes-ffe','gb','snes','pce']};
  st.rom={mode:'asis',console:'snes'}; st.done=false; render();
}
function mismatchHopeless(){
  const st=S[verb];
  st.verify='mismatch'; st.rescue={found:false}; st.rom={mode:'asis',console:'snes'};
  st.done=false; render();
}
function headerDemo(){
  const st=S[verb];
  if(!(verb==='apply'||verb==='undo')) setVerb('apply');
  loadSamples();
  S[verb].rom={mode:'remove',console:'snes'};      // so the advisory shows on success
  render();
}
function scratchBar(){
  const b=(fn,label)=>`<button onclick="${fn}">${label}</button>`;
  let h = b('loadSamples()','fill in some files');
  if(verb!=='create') h += b('loadPPF1()','pretend it\'s a PPF1');
  if(verb==='undo'){
    h += b("setF('undo','peelable','ups')",'a ups (peels)');
    h += b("setF('undo','peelable','ppf3')",'a ppf3 with undo data');
    h += b("setF('undo','peelable','ppf3-bare')",'a ppf3 without it');
    h += b("setF('undo','peelable','no')",'a bps (one-way)');
  }
  if(verb==='apply'||verb==='undo'){
    h += b('headerDemo()','pretend it needs a header strip');
    h += b("clearVerify('match')",'rom matches');
    h += b("mismatchRescuable()",'mismatch — but rescuable');
    h += b("mismatchHopeless()",'mismatch — hopeless');
    h += b("clearVerify('unchecked')",'patch has no checksum');
  }
  if(operandsReady(verb) && verb!=='info' && verb!=='explain' && !S[verb].done)
    h += b('runIt()','run it →');
  h += b('reset()','clear');
  document.getElementById('scratchRow').innerHTML = h;
}

/* ------------------------------------------------------------- render ---- */
function awaitHint(v){
  if(v==='apply'||v==='undo'||v==='create') return 'choose both files to go on — or just drop them on the page.';
  if(v==='convert') return 'choose a patch and a target format to go on.';
  return 'choose a patch to go on — or just drop it on the page.';
}
function verbTabs(){
  const t = v => `<div class="verb ${PRIMARY.includes(v)?'':'lesser'} ${v===verb?'on':''}"
    onclick="setVerb('${v}')">${v}</div>`;
  return PRIMARY.map(t).join('') + `<span class="verb-gap"></span>` + LESSER.map(t).join('');
}
function render(){
  document.getElementById('verbs').innerHTML = verbTabs();
  scratchBar();

  const st = S[verb];
  const ready = operandsReady(verb);
  const done = !!st.done;
  const textVerb = verb==='info'||verb==='explain';
  const fmtKey = verb==='create'?'format':verb==='convert'?'to':null;

  // once it's done, the panel IS the page — the form recedes rather than competing with it
  if(done){
    document.getElementById('stage').innerHTML = `
      <div class="sentence">${sentence(verb)}</div>
      ${successPanel()}
      <p class="foot-label">command equivalent</p>
      ${cliHtml(verb)}`;
    return;
  }

  const bothRoms = verb==='create' && st.files.orig && st.files.mod;
  const facts = (verb==='apply'||verb==='undo') ? romFactsCard(verb) : '';
  const peel  = peelNotice(verb);
  document.getElementById('stage').innerHTML = `
    <div class="sentence">${sentence(verb)}</div>
    ${bothRoms?`<button class="swap" onclick="swapCreateRoms()">the wrong way round? swap them</button>`:''}
    ${peel}
    ${facts}
    ${fmtKey?caveat(verb,fmtKey):''}
    ${fmtKey?picker(verb,fmtKey):''}
    ${ready ? `<div class="divider"></div>${options(verb)}`
            : `<p class="await">${awaitHint(verb)}</p>`}
    ${textVerb ? (verb==='info'?infoResults():explainResults()) : ''}
    <p class="foot-label">command equivalent</p>
    ${cliHtml(verb)}
    ${textVerb ? '' : `<button class="runbtn" ${(ready && !(verb==='undo' && !['ups','ppf3'].includes(st.peelable)))?'':'disabled'} onclick="runIt()">${RUN_LABEL[verb]}</button>`}
    <button class="reset" onclick="reset()">reset</button>`;
}
function setVerb(v){ verb=v; render(); }
wireDrop();
render();
</script>
</body>
</html>
